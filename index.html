<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>A Little Reminder ♡</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #07073e;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 800px;
    overflow: hidden;
    background: #07073e;
}

/* =========================
   PAGES
========================= */

.page {
    position: absolute;
    inset: 0;
    display: none;
}

.page.active {
    display: block;
}

.page img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

/* =========================
   INVISIBLE CLICKABLE BUTTONS
========================= */

.hotspot {
    position: absolute;
    display: block;
    z-index: 10;

    background: transparent;
    border: none;
    outline: none;

    cursor: pointer;
    padding: 0;
    margin: 0;
}

/* =========================
   MUSIC BUTTON
========================= */

#musicBtn {
    position: fixed;

    right: 16px;
    bottom: 18px;

    z-index: 9999;

    width: 52px;
    height: 52px;

    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 50%;

    background: rgba(20,10,70,0.75);

    color: white;

    font-size: 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 3px 14px rgba(0,0,0,0.45);

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

#musicBtn:active {
    transform: scale(0.94);
}
</style>
</head>

         PAGE 1
    =================================================== -->

    <section class="page active" id="p1">

            src="1000023352.png"
