<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #ffd0dc, #fff1f5, #ffc0cf);
  color: #642536;
  overflow: hidden;
}

/* =========================
   PAGES
========================= */

.page {
  display: none;
  width: 100%;
  height: 100vh;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

.page.active {
  display: flex;
}

/* =========================
   FIRST PAGE
========================= */

.card {
  width: 100%;
  max-width: 390px;
  padding: 35px 25px;
  background: rgba(255,255,255,.88);
  border-radius: 30px;
  box-shadow: 0 15px 40px rgba(100,30,50,.18);
}

.card h1 {
  color: #b51f42;
  font-size: 31px;
}

.card p {
  font-size: 17px;
  line-height: 1.7;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  margin-top: 15px;
  background: #c92749;
  color: white;
  font-size: 16px;
  box-shadow: 0 8px 20px rgba(150,20,50,.22);
}

button:active {
  transform: scale(.95);
}

/* =========================
   SMALL DECORATIVE HEARTS
========================= */

.decor {
  position: fixed;
  font-size: 25px;
  opacity: .7;
  animation: float 4s ease-in-out infinite;
  pointer-events: none;
}
