<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #ffd1dc, #fff0f5, #ffc0cb);
  color: #682536;
}

/* PAGES */
.page {
  display: none;
  min-height: 100vh;
  width: 100%;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.page.active {
  display: flex;
}

.card {
  width: 100%;
  max-width: 390px;
  padding: 30px 22px;
  background: rgba(255,255,255,.78);
  border-radius: 30px;
  box-shadow: 0 15px 40px rgba(120,30,60,.18);
}

h1 {
  font-size: 31px;
}

h2 {
  color: #a51f3d;
}

p {
  font-size: 17px;
  line-height: 1.7;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  background: #c92749;
  color: white;
  font-size: 16px;
  margin-top: 15px;
}

/* FLOATING HEARTS */
.decor-heart {
  position: fixed;
  font-size: 28px;
  animation: float 5s infinite ease-in-out;
  pointer-events: none;
}

.h1 { left: 8%; top: 15%; }
.h2 { right: 8%; top: 20%; animation-delay: 1s; }
.h3 { left: 12%; bottom: 15%; animation-delay: 2s; }
.h4 { right: 12%; bottom: 18%; animation-delay: 3s; }
.h5 { left: 25%; top: 8%; animation-delay: .5s; }
.h6 { right: 25%; bottom: 8%; animation-delay: 1.5s; }

@keyframes float {
  0%,100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-15px);
  }
}

/* BALLOON PAGE */
.balloon-area {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.main-balloon {
  position: absolute;
  left: 50%;
  top: 190px;
  transform: translateX(-50%);
  z-index: 5;
