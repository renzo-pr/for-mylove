<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;
  font-family: Georgia, "Times New Roman", serif;
  color: #642536;
  background:
    radial-gradient(circle at 20% 20%, #ffe5ed 0 5%, transparent 6%),
    radial-gradient(circle at 80% 30%, #ffe1e9 0 4%, transparent 5%),
    linear-gradient(135deg, #ffd0dc, #fff0f5, #ffc2d0);
}

/* =========================
   PAGE SYSTEM
========================= */

.page {
  display: none;
  width: 100%;
  height: 100vh;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.page.active {
  display: flex;
}

/* =========================
   FIRST / FINAL CARD
========================= */

.card {
  width: 100%;
  max-width: 390px;
  padding: 35px 25px;
  text-align: center;

  background: rgba(255,255,255,0.90);

  border: 1px solid rgba(255,255,255,0.9);

  border-radius: 30px;

  box-shadow:
    0 15px 40px rgba(100,30,50,0.18);
}

.card h1 {
  margin: 15px 0;
  color: #b51f42;
  font-size: 31px;
}

.card p {
  font-size: 17px;
  line-height: 1.7;
}

button {
  border: none;
  border-radius: 30px;

  padding: 14px 25px;
  margin-top: 15px;

  background: #c92749;
  color: white;

  font-size: 16px;

  box-shadow:
    0 8px 20px rgba(150,20,50,0.22);

  cursor: pointer;
}

button:active {
  transform: scale(0.95);
}

/* =========================
   DECORATIVE HEARTS
========================= */

.decor {
  position: fixed;
  z-index: 1;

  font-size: 25px;
  opacity: 0.65;

  pointer-events: none;

  animation:
    decorativeFloat 4s ease-in-out infinite;
}

.d1 {
  left: 7%;
  top: 15%;
}

.d2 {
  right: 8%;
  top: 20%;
  animation-delay: 1s;
}

.d3 {
  left: 10%;
  bottom: 15%;
  animation-delay: 2s;
}

.d4 {
  right: 10%;
  bottom: 13%;
  animation-delay: 3s;
}

@keyframes decorativeFloat
